  <script>
    // Refreshing any page returns to the top of the homepage.
    (function () {
      try {
        var nav = performance.getEntriesByType('navigation')[0];
        var isHome = /\/(index\.html)?$/.test(location.pathname);
        if (nav && nav.type === 'reload' && !isHome) { location.replace('/'); return; }
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        if (isHome && location.hash) history.replaceState(null, '', location.pathname);
      } catch (e) {}
    })();
