<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yuti Jetani</title>
  <meta name="description" content="Yuti Jetani — portfolio, coming soon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Josefin+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #e9dcee;
      font-family: 'Josefin Sans', sans-serif;
    }
    header {
      background: #8f7591;
      padding: 28px 24px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      color: #fff;
      font-weight: 400;
      font-size: 2.25rem;
      letter-spacing: 0.35em;
      text-indent: 0.35em;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #8f7591;
      color: #fff;
      max-width: 480px;
      width: 100%;
      padding: 56px 40px;
      text-align: center;
      border-radius: 2px;
    }
    .card p {
      margin: 0;
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 2.75rem;
      line-height: 1.25;
    }
  </style>
</head>
<body>
  <header>
    <h1>YUTEA</h1>
  </header>
  <main>
    <div class="card">
      <p>Website under development!</p>
    </div>
  </main>
</body>
</html>
